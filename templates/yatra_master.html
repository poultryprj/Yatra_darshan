{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Darshan Yatra - Yatra Master (Premium Orange)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.css">
    
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    <link rel="manifest" href="{% static 'assets/__manifest.json' %}">

    <style>
        :root {
            --brand-orange: #FF7B00; /* Vibrant Brand Orange */
            --brand-orange-dark: #E06B00; /* Deep Orange for hovers */
            --brand-primary: #0F172A; /* Slate Charcoal */
            --brand-orange-light: #FFF7ED; /* Soft light orange tint */
            --accent-green: #10B981; /* Success Green */
            --danger-red: #EF4444; /* Soft Red */
            --bg-slate: #f8fafc;
            --border-slate: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-slate); 
            color: var(--text-dark);
            padding-top: 60px;
        }

        /* Fixed Navigation Header */
        .navbar { 
            background: linear-gradient(135deg, var(--brand-orange) 0%, var(--brand-orange-dark) 100%); 
            height: 60px;
            box-shadow: 0 4px 20px rgba(255, 123, 0, 0.2); 
            border: none;
        }
        .back-btn { font-size: 1.5rem; color: white; text-decoration: none; transition: opacity 0.2s; }
        .back-btn:hover { opacity: 0.8; }
        .navbar-brand { font-weight: 700; font-size: 18px; letter-spacing: -0.3px; }

        /* Main Card Container */
        .container-main { 
            max-width: 550px; 
            margin: 20px auto 40px auto; 
            background: #ffffff; 
            padding: 24px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04); 
            border: 1px solid var(--border-slate);
        }

        /* Premium Buttons */
        .btn-custom { 
            background: var(--brand-orange); 
            color: #fff !important; 
            border: none; 
            font-weight: 700; 
            border-radius: 12px;
            padding: 10px 20px;
            box-shadow: 0 4px 14px rgba(255, 123, 0, 0.25);
            transition: all 0.2s;
        }
        .btn-custom:active { transform: scale(0.98); }
        .btn-custom:hover { background: var(--brand-orange-dark); }

        /* Modern Premium Search Input Box */
        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .search-input-field {
            width: 100%;
            height: 48px;
            padding: 10px 45px 10px 16px;
            border: 1.5px solid var(--border-slate);
            border-radius: 12px;
            background: #ffffff;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }
        .search-input-field:focus {
            border-color: var(--brand-orange);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 123, 0, 0.1);
        }
        .search-icon-inside {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        /* Yatra Card Styling */
        .yatra-card { 
            padding: 16px; 
            border: 1px solid var(--border-slate); 
            border-radius: 16px; 
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.01);
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 14px;
        }
        .yatra-card:hover {
            border-color: var(--brand-orange);
            box-shadow: 0 6px 18px rgba(255, 123, 0, 0.08);
        }
        .yatra-card:last-child { margin-bottom: 0; }

        .yatra-row-1 { display: flex; justify-content: space-between; align-items: center; }
        .yatra-row-2 { margin-top: 8px; border-top: 1px dashed var(--border-slate); padding-top: 8px; }
        .yatra-name { font-size: 15px; font-weight: 700; color: var(--brand-primary); }
        .yatra-date { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .yatra-actions { display: flex; gap: 0.75rem; align-items: center; }
        
        /* Badges */
        .badge {
            font-weight: 700; 
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .bg-success-soft { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .bg-danger-soft { background-color: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }

        /* Edit Button */
        .action-btn-edit {
            border-color: var(--border-slate);
            color: var(--brand-orange);
            border-radius: 8px;
            padding: 6px 10px;
            transition: all 0.2s;
        }
        .action-btn-edit:hover {
            background-color: var(--brand-orange);
            color: #ffffff;
            border-color: var(--brand-orange);
        }

        @media (max-width: 480px) {
            .container-main { margin: 20px 0; border-radius: 0; padding: 16px 12px; }
        }

        /* Animated Floating Labels Form */
        .form-group.basic.animated { margin-bottom: 16px; }
        .input-wrapper { position: relative; }
        .input-wrapper .float-label { 
            position: absolute; 
            left: 12px; 
            top: 15px; 
            font-size: 14px; 
            color: var(--text-muted); 
            pointer-events: none; 
            transition: all 0.2s ease; 
            padding: 0 4px; 
        }
        .input-wrapper input.form-control,
        .input-wrapper select.form-select {
            width: 100%;
            height: 52px;
            padding: 18px 12px 6px 12px;
            border: 1.5px solid var(--border-slate);
            border-radius: 12px;
            background: #F8FAFC;
            outline: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .input-wrapper input.form-control:focus,
        .input-wrapper select.form-select:focus {
            border-color: var(--brand-orange);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 123, 0, 0.1);
        }

        .input-wrapper input.form-control:focus + .float-label,
        .input-wrapper input.form-control:not(:placeholder-shown) + .float-label,
        .input-wrapper select.form-select:focus + .float-label,
        .input-wrapper select.form-select:not([value=""]) + .float-label {
            top: 4px; 
            font-size: 10px; 
            color: var(--brand-orange); 
            font-weight: 700;
            background: transparent;
        }

        /* select select2 reset */
        .select-fix { height: calc(2.75rem + 10px); padding-top: 10px; }

        /* Style to ensure Select2 fits well in the modal */
        .select2-container--bootstrap-5 .select2-dropdown {
            z-index: 1060; /* Higher z-index to appear above the modal backdrop */
        }
        
        /* Modal Style */
        .modal-content {
            border-radius: 20px;
            overflow: hidden;
            border: none;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.15);
        }
        .modal-header {
            background-color: var(--brand-primary);
            color: #ffffff;
            border-bottom: none;
        }
        .modal-title { color: #ffffff; font-weight: 700; font-size: 16px; }
        .btn-close-white { filter: invert(1) grayscale(1) brightness(2); }
    </style>
</head>
<body>

<nav class="navbar fixed-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <a href="{% url 'dashboard' %}" class="back-btn"><i class="bi bi-arrow-left-circle-fill"></i></a>
        <span class="navbar-brand mb-0 h1" style="color:white">Yatra Master</span>
        <span style="width: 30px;"></span> 
    </div>
</nav>

<div class="container-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 fs-5 text-dark fw-bold">Manage Yatras</h2>
        <button class="btn btn-custom" id="addYatraBtn"><i class="bi bi-plus-circle-fill me-1"></i> Add Yatra</button>
    </div>

    <!-- 🔴 NEW REAL-TIME SEARCH BOX -->
    <div class="search-input-wrapper mb-3">
        <input id="searchYatraInput" type="text" class="search-input-field" placeholder="Search Route/Yatra Name..." autocomplete="off">
        <span class="search-icon-inside"><i class="bi bi-search"></i></span>
    </div>

    <div id="yatraTableBody">
        {% for yatra in yatras %}
        <!-- 🔴 दुरुस्ती: data-status मध्ये YatraStatusId वापरला आहे जो आपण नवीन जोडला आहे -->
        <div class="yatra-card" 
             data-yatra-id="{{ yatra.YatraId }}" 
             data-route-id="{{ yatra.YatraRouteId }}" 
             data-date-time="{{ yatra.YatraDateTime }}"
             data-fees="{{ yatra.YatraFees|default_if_none:'' }}" 
             data-status="{{ yatra.YatraStatusId }}">
            
            <div class="yatra-row-1">
                <span class="yatra-name">{{ yatra.YatraRouteName }}</span>
                <div class="yatra-actions">
                    <!-- 🔴 दुरुस्ती: बॅज दाखवण्यासाठी YatraStatus == "Active" कन्डिशन ठेवली आहे -->
                    {% if yatra.YatraStatus == "Active" %}
                        <span class="badge bg-success-soft">Active</span>
                    {% else %}
                        <span class="badge bg-danger-soft">Inactive</span>
                    {% endif %}
                    <button class="btn btn-sm btn-outline-primary edit-btn action-btn-edit"><i class="bi bi-pencil-fill"></i></button>
                </div>
            </div>
            <div class="yatra-row-2">
                <span class="yatra-date"><i class="bi bi-calendar3 me-2"></i>{{ yatra.YatraDateTime }}</span>
            </div>
        </div>
        {% empty %}
        <div class="text-center text-muted py-4" id="emptyYatrasMessage">No yatras found.</div>
        {% endfor %}
    </div>
</div>

<div class="modal fade" id="yatraModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle"></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <form id="yatraForm">
            <input type="hidden" id="formYatraId">
            
            <div class="form-group basic animated">
                <div class="input-wrapper">
                    <select class="form-select select-fix" id="formRouteId" style="width:100%;" required>
                        <option value="">Select a Route</option>
                        {% for route in routes %}
                            <option value="{{ route.YatraRouteId }}">{{ route.YatraRouteName }}</option>
                        {% endfor %}
                    </select>
                    <label class="float-label">Route</label>
                </div>
            </div>

            <div class="form-group basic animated">
                <div class="input-wrapper">
                    <input type="datetime-local" class="form-control" id="formDateTime" required>
                    <label class="float-label">Date and Time</label>
                </div>
            </div>

            <div class="form-group basic animated">
                <div class="input-wrapper">
                    <input type="number" class="form-control" id="formFees" placeholder=" " required>
                    <label class="float-label">Fees</label>
                </div>
            </div>

            <div class="form-group basic animated">
                <div class="input-wrapper">
                    <select class="form-select select-fix" id="formStatus" style="width:100%;">
                        <option value="1">Active</option>
                        <option value="2">Deactivated</option>
                    </select>
                    <label class="float-label">Status</label>
                </div>
            </div>
        </form>
      </div>
      <div class="modal-footer" style="border-top: none;">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius:10px; font-weight:700;">Close</button>
        <button type="button" class="btn btn-custom" id="saveYatraBtn">Save Yatra</button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    const yatraModal = new bootstrap.Modal(document.getElementById('yatraModal'));
    const yatraTableBody = document.getElementById('yatraTableBody');

    $(document).ready(function() {
        $('#formRouteId').select2({ theme: "bootstrap-5", dropdownParent: $('#yatraModal') });
        $('#formStatus').select2({ theme: "bootstrap-5", dropdownParent: $('#yatraModal'), minimumResultsForSearch: Infinity });
    });

    // 🔴 NEW: CLIENT-SIDE INSTANT FILTER SEARCH LOGIC
    const searchInput = document.getElementById('searchYatraInput');
    const noResultsDiv = document.createElement('div');
    noResultsDiv.id = 'noResultsMessage';
    noResultsDiv.className = 'text-center text-muted py-4 d-none';
    noResultsDiv.innerHTML = '<i class="bi bi-info-circle me-1"></i>No matching routes found.';
    yatraTableBody.appendChild(noResultsDiv);

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const cards = document.querySelectorAll('.yatra-card');
        let visibleCount = 0;

        cards.forEach(card => {
            const yatraName = card.querySelector('.yatra-name').textContent.toLowerCase();
            if (yatraName.includes(query)) {
                card.style.setProperty('display', 'block', 'important');
                visibleCount++;
            } else {
                card.style.setProperty('display', 'none', 'important');
            }
        });

        if (visibleCount === 0 && query !== '') {
            noResultsDiv.classList.remove('d-none');
        } else {
            noResultsDiv.classList.add('d-none');
        }
    });

    function formatToInput(apiDate) {
        if (!apiDate) return '';
        const [datePart, timePart] = apiDate.split(' ');
        const [day, month, year] = datePart.split('-');
        return `${year}-${month}-${day}T${timePart}`;
    }

    document.getElementById('addYatraBtn').addEventListener('click', () => {
        document.getElementById('yatraForm').reset();
        document.getElementById('formYatraId').value = ''; 
        document.getElementById('modalTitle').textContent = 'Add New Yatra';
        $('#formRouteId').val('').trigger('change');
        $('#formStatus').val('1').trigger('change');
        yatraModal.show();
    });

    yatraTableBody.addEventListener('click', (e) => {
        const editButton = e.target.closest('.edit-btn');
        if (editButton) {
            const card = editButton.closest('.yatra-card');
            document.getElementById('formYatraId').value = card.dataset.yatraId;
            document.getElementById('formDateTime').value = formatToInput(card.dataset.dateTime);
            document.getElementById('formFees').value = card.dataset.fees; 
            document.getElementById('modalTitle').textContent = 'Edit Yatra';
            $('#formRouteId').val(card.dataset.routeId).trigger('change');
            
            // 🔴 दुरुस्ती: YatraStatusId थेट वापरल्यामुळे ड्रॉपडाउन अचूक सेट होईल
            let statusValue = card.dataset.status;
            $('#formStatus').val(statusValue).trigger('change');

            yatraModal.show();
        }
    });

    document.getElementById('saveYatraBtn').addEventListener('click', () => {
        const yatraId = document.getElementById('formYatraId').value;
        const dateTime = document.getElementById('formDateTime').value;
        const fees = document.getElementById('formFees').value;
        const routeId = $('#formRouteId').val();
        const status = $('#formStatus').val();

        if (!routeId || !dateTime || !fees) {
            swal("Error", "All fields are required.", "error");
            return;
        }

        let formData = new FormData();
        formData.append('routeId', routeId);
        formData.append('dateTime', dateTime); 
        formData.append('fees', fees);
        formData.append('status', status);
        if (yatraId) {
            formData.append('action', 'update_yatra');
            formData.append('yatraId', yatraId);
        } else {
            formData.append('action', 'add_yatra');
        }
        fetch("{% url 'yatra_master_api' %}", { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.message_code === 1000) {
                    swal({ title: "Success!", text: data.message_text, type: "success" }, () => location.reload());
                } else {
                    swal("Error", data.message_text || "An error occurred.", "error");
                }
            });
    });
</script>
</body>
</html>
